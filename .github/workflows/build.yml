name: Build

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Provision exact PlexonCore 2.0.4
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/PlexonCore-2.0.4.jar https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar
          echo '61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf  /tmp/PlexonCore-2.0.4.jar' | sha256sum -c -
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file -Dfile=/tmp/PlexonCore-2.0.4.jar -DgroupId=com.zpkdxgames -DartifactId=PlexonCore -Dversion=2.0.4 -Dpackaging=jar
      - name: Test and package
        run: mvn -B -ntp clean verify
      - name: Verify installable JAR
        run: ./scripts/verify-distribution.sh target/PlexonHomes-2.0.0-rc.1.jar
      - name: Write test summary
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for path in glob.glob('target/surefire-reports/TEST-*.xml'):
              root = ET.parse(path).getroot()
              for key in totals: totals[key] += int(root.attrib.get(key, 0))
          text = f"{totals['tests']} executed / {totals['failures']} failures / {totals['errors']} errors / {totals['skipped']} skipped\n"
          open('TEST_SUMMARY.txt', 'w').write(text); print(text, end='')
          PY
      - name: Write provenance
        shell: bash
        run: |
          {
            echo 'repository=ZpkDxGames/PlexonHomes'
            echo "source_sha=$GITHUB_SHA"
            echo 'version=2.0.0-rc.1'
            echo 'java=25'
            echo 'class_major=69'
            echo 'plexoncore=2.0.4'
            echo 'plexoncore_sha256=61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf'
            echo 'rollback_tag=v1.0.1'
            echo 'rollback_sha=d20bef0a76cd3006df51d46d67a3e48636650d31'
          } > PROVENANCE.txt
      - name: Checksum and whitespace
        shell: bash
        run: |
          sha256sum target/PlexonHomes-2.0.0-rc.1.jar | sed 's#target/##' > SHA256SUMS.txt
          git diff --check origin/main...HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: PlexonHomes-2.0.0-rc.1-${{ github.sha }}
          path: |
            target/PlexonHomes-2.0.0-rc.1.jar
            SHA256SUMS.txt
            TEST_SUMMARY.txt
            PROVENANCE.txt
          if-no-files-found: error
