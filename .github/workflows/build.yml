name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Provision pinned PlexonCore 2.0.4
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-2.0.4.jar"
          curl --fail --location --silent --show-error --output "$core_jar" \
            https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar
          echo '61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf  '"$core_jar" | sha256sum -c -
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="$core_jar" -DgroupId=com.zpkdxgames -DartifactId=PlexonCore \
            -Dversion=2.0.4 -Dpackaging=jar -DgeneratePom=true
      - name: Verify
        run: mvn -B -ntp clean verify
      - name: Verify distribution
        shell: bash
        run: |
          set -euo pipefail
          jar_path=target/PlexonHomes-1.0.1.jar
          test -s "$jar_path"
          jar tf "$jar_path" > target/jar-contents.txt
          grep -qx 'plugin.yml' target/jar-contents.txt
          grep -qx 'com/plexon/homes/PlexonHomes.class' target/jar-contents.txt
          grep -qx 'com/plexon/homes/api/PlexonHomesAPI.class' target/jar-contents.txt
          grep -q '^org/sqlite/' target/jar-contents.txt
          if grep -q '^com/zpkdxgames/plexoncore/' target/jar-contents.txt; then echo 'PlexonCore must not be shaded'; exit 1; fi
          if grep -q '^org/bukkit/' target/jar-contents.txt; then echo 'Paper API must not be shaded'; exit 1; fi
          unzip -p "$jar_path" plugin.yml | grep -F "version: '1.0.1'"
          (cd target && sha256sum PlexonHomes-1.0.1.jar > SHA256SUMS.txt && sha256sum --check SHA256SUMS.txt)
          git diff --check origin/main...HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: PlexonHomes-1.0.1-${{ github.sha }}
          path: |
            target/PlexonHomes-1.0.1.jar
            target/SHA256SUMS.txt
