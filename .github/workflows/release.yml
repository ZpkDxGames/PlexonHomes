name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify tag
        shell: bash
        run: test "${GITHUB_REF_NAME}" = 'v1.0.0'
      - name: Provision pinned PlexonCore 2.0.3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p libs
          curl -fsSL -o libs/PlexonCore-2.0.3.jar https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.3/PlexonCore-2.0.3.jar
          echo '4c47963ebe7f311917e967678d198f5ea1846fb8897fd607d7d0d734fd8a9f8e  libs/PlexonCore-2.0.3.jar' | sha256sum -c -
      - name: Build and test
        run: mvn -B -ntp clean verify
      - name: Verify and checksum
        shell: bash
        run: |
          set -euo pipefail
          jar_path=target/PlexonHomes-1.0.0.jar
          test -s "$jar_path"
          jar tf "$jar_path" | grep -qx 'plugin.yml'
          jar tf "$jar_path" | grep -qx 'com/plexon/homes/PlexonHomes.class'
          jar tf "$jar_path" | grep -qx 'com/plexon/homes/api/PlexonHomesAPI.class'
          jar tf "$jar_path" | grep -q '^org/sqlite/'
          if jar tf "$jar_path" | grep -q '^com/zpkdxgames/plexoncore/'; then exit 1; fi
          sha256sum "$jar_path" > SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PlexonHomes 1.0.0
          body_path: releases/1.0.0.md
          files: |
            target/PlexonHomes-1.0.0.jar
            SHA256SUMS.txt
