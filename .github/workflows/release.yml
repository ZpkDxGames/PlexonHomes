name: Release 2.0.0-rc.1

on:
  push:
    branches: [phase2/2.0.0-premium-homes]
    tags: ['v2.0.0-rc.1']

permissions:
  contents: write
  actions: read
  pull-requests: read

jobs:
  freeze:
    if: ${{ github.ref == 'refs/heads/phase2/2.0.0-premium-homes' && contains(github.event.head_commit.message, '[freeze-rc]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require exact-head branch and PR CI before tagging
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHA="$GITHUB_SHA"
          TAG='v2.0.0-rc.1'
          REPO="$GITHUB_REPOSITORY"
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then echo "$TAG already exists; refusing to move it." >&2; exit 1; fi
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then echo "$TAG release already exists; refusing replacement." >&2; exit 1; fi
          for attempt in $(seq 1 90); do
            JSON="$(gh run list --repo "$REPO" --workflow Build --commit "$SHA" --limit 20 --json databaseId,event,status,conclusion,headSha)"
            if echo "$JSON" | jq -e '.[] | select((.event == "push" or .event == "pull_request") and .status == "completed" and .conclusion != "success")' >/dev/null; then
              echo 'Exact-head CI failed.' >&2; echo "$JSON"; exit 1
            fi
            PUSH_OK=false; PR_OK=false
            if echo "$JSON" | jq -e '.[] | select(.event == "push" and .status == "completed" and .conclusion == "success")' >/dev/null; then PUSH_OK=true; fi
            if echo "$JSON" | jq -e '.[] | select(.event == "pull_request" and .status == "completed" and .conclusion == "success")' >/dev/null; then PR_OK=true; fi
            if [[ "$PUSH_OK" == true && "$PR_OK" == true ]]; then break; fi
            if [[ "$attempt" == 90 ]]; then echo 'Timed out waiting for exact-head source + PR CI.' >&2; echo "$JSON"; exit 1; fi
            sleep 5
          done
          PR_JSON="$(gh pr list --repo "$REPO" --state open --head phase2/2.0.0-premium-homes --json number,isDraft,headRefOid --limit 5)"
          echo "$PR_JSON" | jq -e --arg sha "$SHA" 'length == 1 and .[0].isDraft == true and .[0].headRefOid == $sha' >/dev/null || {
            echo 'Expected exactly one OPEN / DRAFT PR at exact candidate SHA.' >&2; echo "$PR_JSON"; exit 1;
          }
          gh api --method POST "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA"

  release:
    if: ${{ github.ref == 'refs/tags/v2.0.0-rc.1' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to replace candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.0.0-rc.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo 'Candidate release already exists.' >&2; exit 1; fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Provision exact PlexonCore 2.0.4
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/PlexonCore-2.0.4.jar https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar
          echo '61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf  /tmp/PlexonCore-2.0.4.jar' | sha256sum -c -
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file -Dfile=/tmp/PlexonCore-2.0.4.jar -DgroupId=com.zpkdxgames -DartifactId=PlexonCore -Dversion=2.0.4 -Dpackaging=jar
      - name: Rebuild exact tag
        run: mvn -B -ntp clean verify
      - name: Verify distribution
        run: ./scripts/verify-distribution.sh target/PlexonHomes-2.0.0-rc.1.jar
      - name: Write certification assets
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for path in glob.glob('target/surefire-reports/TEST-*.xml'):
              root = ET.parse(path).getroot()
              for key in totals: totals[key] += int(root.attrib.get(key, 0))
          text = f"{totals['tests']} executed / {totals['failures']} failures / {totals['errors']} errors / {totals['skipped']} skipped\n"
          open('TEST_SUMMARY.txt','w').write(text)
          print(text, end='')
          PY
          {
            echo 'repository=ZpkDxGames/PlexonHomes'
            echo "source_sha=$GITHUB_SHA"
            echo 'version=2.0.0-rc.1'
            echo 'java=25'
            echo 'class_major=69'
            echo 'plexoncore=2.0.4'
            echo 'plexoncore_sha256=61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf'
            echo 'rollback_tag=v1.0.1'
            echo 'rollback_sha=d20bef0a76cd3006df51d46d67a3e48636650d31'
            echo 'runtime_certification=NOT_EXECUTED'
          } > PROVENANCE.txt
          sha256sum target/PlexonHomes-2.0.0-rc.1.jar | sed 's#target/##' > SHA256SUMS.txt
      - name: Publish immutable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.0.0-rc.1 target/PlexonHomes-2.0.0-rc.1.jar SHA256SUMS.txt TEST_SUMMARY.txt PROVENANCE.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'PlexonHomes 2.0.0-rc.1' \
            --notes-file releases/2.0.0-rc.1.md --prerelease

  verify-published:
    if: ${{ github.ref == 'refs/tags/v2.0.0-rc.1' }}
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - name: Verify published candidate boundary
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          SHA="$GITHUB_SHA"
          TAG='v2.0.0-rc.1'

          REF_JSON="$(gh api "repos/$REPO/git/ref/tags/$TAG")"
          echo "$REF_JSON" | jq -e --arg sha "$SHA" '.object.type == "commit" and .object.sha == $sha' >/dev/null

          RELEASE_JSON="$(gh release view "$TAG" --repo "$REPO" --json tagName,isPrerelease,targetCommitish,assets)"
          echo "$RELEASE_JSON" | jq -e --arg sha "$SHA" '.tagName == "v2.0.0-rc.1" and .isPrerelease == true and .targetCommitish == $sha' >/dev/null
          ACTUAL_ASSETS="$(echo "$RELEASE_JSON" | jq -r '.assets[].name' | sort)"
          EXPECTED_ASSETS="$(printf '%s\n' PlexonHomes-2.0.0-rc.1.jar PROVENANCE.txt SHA256SUMS.txt TEST_SUMMARY.txt | sort)"
          diff -u <(printf '%s\n' "$EXPECTED_ASSETS") <(printf '%s\n' "$ACTUAL_ASSETS")

          PR_JSON="$(gh pr list --repo "$REPO" --state open --head phase2/2.0.0-premium-homes --json number,isDraft,headRefOid,state --limit 5)"
          echo "$PR_JSON" | jq -e --arg sha "$SHA" 'length == 1 and .[0].number == 3 and .[0].isDraft == true and .[0].state == "OPEN" and .[0].headRefOid == $sha' >/dev/null

          if gh api "repos/$REPO/git/ref/tags/v2.0.0" >/dev/null 2>&1; then echo 'Stable v2.0.0 tag must not exist.' >&2; exit 1; fi
          if gh release view v2.0.0 --repo "$REPO" >/dev/null 2>&1; then echo 'Stable v2.0.0 release must not exist.' >&2; exit 1; fi

          mkdir -p /tmp/plexonhomes-release
          gh release download "$TAG" --repo "$REPO" --dir /tmp/plexonhomes-release \
            --pattern 'PlexonHomes-2.0.0-rc.1.jar' --pattern 'SHA256SUMS.txt' --pattern 'TEST_SUMMARY.txt' --pattern 'PROVENANCE.txt'
          cd /tmp/plexonhomes-release
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 4
          test -s PlexonHomes-2.0.0-rc.1.jar
          sha256sum --check SHA256SUMS.txt
          grep -Fx 'repository=ZpkDxGames/PlexonHomes' PROVENANCE.txt
          grep -Fx "source_sha=$SHA" PROVENANCE.txt
          grep -Fx 'version=2.0.0-rc.1' PROVENANCE.txt
          grep -Fx 'java=25' PROVENANCE.txt
          grep -Fx 'class_major=69' PROVENANCE.txt
          grep -Fx 'plexoncore=2.0.4' PROVENANCE.txt
          grep -Fx 'rollback_tag=v1.0.1' PROVENANCE.txt
          grep -Fx 'rollback_sha=d20bef0a76cd3006df51d46d67a3e48636650d31' PROVENANCE.txt
          grep -Fx 'runtime_certification=NOT_EXECUTED' PROVENANCE.txt
          grep -Eq '^[0-9]+ executed / 0 failures / 0 errors / 0 skipped$' TEST_SUMMARY.txt
