name: Publish PlexonHomes 2.0.0 RC2

on:
  push:
    branches:
      - phase3/feature-consolidation

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: plexonhomes-2.0.0-rc.2-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Require source and PR CI success for this exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            runs="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/runs" -f head_sha="$GITHUB_SHA" -f per_page=30)"
            push_state="$(jq -r '[.workflow_runs[] | select(.name == "Build" and .event == "push")][0] | if . == null then "missing" else (.status + ":" + (.conclusion // "")) end' <<<"$runs")"
            pr_state="$(jq -r '[.workflow_runs[] | select(.name == "Build" and .event == "pull_request")][0] | if . == null then "missing" else (.status + ":" + (.conclusion // "")) end' <<<"$runs")"
            echo "source=${push_state} pr=${pr_state}"
            if [[ "$push_state" == "completed:success" && "$pr_state" == "completed:success" ]]; then
              exit 0
            fi
            if [[ "$push_state" == completed:* && "$push_state" != "completed:success" ]]; then
              echo "Source CI failed for $GITHUB_SHA" >&2
              exit 1
            fi
            if [[ "$pr_state" == completed:* && "$pr_state" != "completed:success" ]]; then
              echo "PR CI failed for $GITHUB_SHA" >&2
              exit 1
            fi
            sleep 5
          done
          echo "Timed out waiting for source and PR Build CI on $GITHUB_SHA" >&2
          exit 1

      - name: Verify release boundary is still open and immutable
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='v2.0.0-rc.2'
          STABLE='v2.0.0'
          pr="$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/4")"
          test "$(jq -r '.state' <<<"$pr")" = 'open'
          test "$(jq -r '.draft' <<<"$pr")" = 'true'
          test "$(jq -r '.merged_at // ""' <<<"$pr")" = ''
          test "$(jq -r '.head.sha' <<<"$pr")" = "$GITHUB_SHA"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG release already exists; refusing to replace it" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "$TAG tag already exists; refusing to move it" >&2
            exit 1
          fi
          if gh release view "$STABLE" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/${STABLE}" >/dev/null 2>&1; then
            echo "Stable $STABLE must remain unpublished during RC closure" >&2
            exit 1
          fi

      - name: Verify project version and release notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          test "$VERSION" = '2.0.0-rc.2'
          test -s releases/2.0.0-rc.2.md

      - name: Provision exact PlexonCore 2.0.4
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/PlexonCore-2.0.4.jar https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar
          echo '61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf  /tmp/PlexonCore-2.0.4.jar' | sha256sum -c -
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file -Dfile=/tmp/PlexonCore-2.0.4.jar -DgroupId=com.zpkdxgames -DartifactId=PlexonCore -Dversion=2.0.4 -Dpackaging=jar

      - name: Test and package exact candidate
        run: mvn -B -ntp clean verify

      - name: Verify distribution
        run: ./scripts/verify-distribution.sh target/PlexonHomes-2.0.0-rc.2.jar

      - name: Generate certification assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, os, sys, xml.etree.ElementTree as ET
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for path in glob.glob('target/surefire-reports/TEST-*.xml'):
              root = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))
          passed = totals['tests'] > 0 and not any(totals[k] for k in ('failures','errors','skipped'))
          text = f"{totals['tests']} executed / {totals['failures']} failures / {totals['errors']} errors / {totals['skipped']} skipped\n"
          open('TEST_SUMMARY.txt','w').write(text)
          print(text, end='')
          if not passed:
              sys.exit(1)
          PY
          {
            echo 'repository=ZpkDxGames/PlexonHomes'
            echo "source_sha=$GITHUB_SHA"
            echo 'accepted_phase3_head=61aa0724848e84c47c674432333b180c20b41a6e'
            echo 'version=2.0.0-rc.2'
            echo 'tag=v2.0.0-rc.2'
            echo 'branch=phase3/feature-consolidation'
            echo 'pull_request=4'
            echo 'pull_request_state=OPEN_DRAFT_UNMERGED'
            echo 'java=25'
            echo 'class_major=69'
            echo 'paper_api=26.2.build.121-stable'
            echo 'plexoncore=2.0.4'
            echo 'plexoncore_sha256=61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf'
            echo 'rollback_tag=v1.0.1'
            echo 'rollback_sha=d20bef0a76cd3006df51d46d67a3e48636650d31'
            echo 'runtime_certification=NOT_EXECUTED'
            echo 'production_cutover=PENDING'
            echo 'stable_v2.0.0=UNPUBLISHED'
          } > PROVENANCE.txt
          sha256sum target/PlexonHomes-2.0.0-rc.2.jar | sed 's#target/##' > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Tag exact release-only descendant
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a v2.0.0-rc.2 "$GITHUB_SHA" -m 'PlexonHomes 2.0.0-rc.2'
          git push origin v2.0.0-rc.2

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v2.0.0-rc.2 \
            target/PlexonHomes-2.0.0-rc.2.jar \
            SHA256SUMS.txt \
            TEST_SUMMARY.txt \
            PROVENANCE.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --verify-tag \
            --prerelease \
            --title 'PlexonHomes 2.0.0-rc.2' \
            --notes-file releases/2.0.0-rc.2.md

      - name: Verify published candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_JSON="$(gh release view v2.0.0-rc.2 --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,targetCommitish,assets)"
          echo "$RELEASE_JSON" | jq -e --arg sha "$GITHUB_SHA" '.tagName == "v2.0.0-rc.2" and .isPrerelease == true and .targetCommitish == $sha' >/dev/null
          ACTUAL_ASSETS="$(echo "$RELEASE_JSON" | jq -r '.assets[].name' | sort)"
          EXPECTED_ASSETS="$(printf '%s\n' PlexonHomes-2.0.0-rc.2.jar PROVENANCE.txt SHA256SUMS.txt TEST_SUMMARY.txt | sort)"
          diff -u <(printf '%s\n' "$EXPECTED_ASSETS") <(printf '%s\n' "$ACTUAL_ASSETS")
