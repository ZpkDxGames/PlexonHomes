name: Publish PlexonHomes 1.0.0 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.0.0-once.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Guard exact project version
        shell: bash
        run: |
          set -euo pipefail
          test "$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" = '1.0.0'
      - name: Provision pinned PlexonCore 2.0.3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p libs
          curl -fsSL -o libs/PlexonCore-2.0.3.jar https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.3/PlexonCore-2.0.3.jar
          echo '4c47963ebe7f311917e967678d198f5ea1846fb8897fd607d7d0d734fd8a9f8e  libs/PlexonCore-2.0.3.jar' | sha256sum -c -
      - name: Build exact main commit
        run: mvn -B -ntp clean verify
      - name: Verify distribution
        shell: bash
        run: |
          set -euo pipefail
          jar_path=target/PlexonHomes-1.0.0.jar
          test -s "$jar_path"
          jar tf "$jar_path" | grep -qx 'plugin.yml'
          jar tf "$jar_path" | grep -qx 'com/plexon/homes/PlexonHomes.class'
          jar tf "$jar_path" | grep -qx 'com/plexon/homes/api/PlexonHomesAPI.class'
          jar tf "$jar_path" | grep -q '^org/sqlite/'
          if jar tf "$jar_path" | grep -q '^com/zpkdxgames/plexoncore/'; then echo 'PlexonCore must not be shaded'; exit 1; fi
          if jar tf "$jar_path" | grep -q '^org/bukkit/'; then echo 'Paper API must not be shaded'; exit 1; fi
          sha256sum "$jar_path" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo 'v1.0.0 already exists; refusing to replace immutable release assets.'
            exit 0
          fi
          gh release create v1.0.0 \
            target/PlexonHomes-1.0.0.jar \
            SHA256SUMS.txt \
            --target "${GITHUB_SHA}" \
            --title 'PlexonHomes 1.0.0' \
            --notes-file releases/1.0.0.md
