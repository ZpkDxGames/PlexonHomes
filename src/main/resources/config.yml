config-version: 2
homes:
  default-name: home
  max-name-length: 24
  allow-use-above-limit: true
limits:
  default: 15
  permission-prefix: plexonhomes.limit.
  unlimited-permission: plexonhomes.limit.unlimited
worlds:
  set:
    mode: BLACKLIST
    values: [lobby]
  teleport:
    mode: BLACKLIST
    values: []
teleport:
  warmup-seconds: 3
  cooldown-seconds: 10
  cancel-on-movement: true
  movement-threshold: 0.01
  cancel-on-damage: true
  fee: 0.0
safe-teleport:
  enabled: true
  search-nearby: true
  horizontal-radius: 3
  vertical-radius: 4
gui:
  delete-confirmation-seconds: 15
migration:
  mode: PRIMARY
